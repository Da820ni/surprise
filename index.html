<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>A little question for you 🌸</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: Georgia, 'Times New Roman', serif;
    background: #fce4ec;
    color: #5a3d4f;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    position: relative;
  }

  /* ---- Floating hearts background ---- */
  #hearts {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .heart {
    position: absolute;
    bottom: -40px;
    font-size: 20px;
    opacity: 0;
    animation: floatUp linear infinite;
    user-select: none;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) scale(.6) rotate(0deg); opacity: 0; }
    10%  { opacity: .9; }
    90%  { opacity: .7; }
    100% { transform: translateY(-110vh) scale(1.1) rotate(40deg); opacity: 0; }
  }

  /* ---- Card ---- */
  .card {
    position: relative;
    z-index: 2;
    background: #ffffff;
    border-radius: 28px;
    box-shadow: 0 18px 50px rgba(233, 30, 140, 0.18), 0 4px 14px rgba(0,0,0,0.06);
    padding: 38px 30px 42px;
    width: 100%;
    max-width: 420px;
    text-align: center;
  }

  /* ---- Screens ---- */
  .screen { display: none; }
  .screen.active {
    display: block;
    animation: fadeIn .6s ease both;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .kitty {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 24px;
    margin: 0 auto 22px;
    display: block;
    background: #fdf2f7;
    box-shadow: 0 6px 18px rgba(233, 30, 140, 0.18);
  }

  h1 {
    font-size: 1.5rem;
    line-height: 1.35;
    font-weight: normal;
    margin-bottom: 26px;
    color: #c2185b;
  }
  h2 {
    font-size: 1.45rem;
    line-height: 1.35;
    font-weight: normal;
    color: #c2185b;
    margin-bottom: 12px;
  }
  .sub {
    font-size: .95rem;
    color: #9c7c8e;
    margin-bottom: 24px;
  }
  .big-emoji {
    font-size: 4.4rem;
    line-height: 1;
    margin-bottom: 18px;
    display: block;
  }

  /* ---- Buttons ---- */
  .btn {
    font-family: inherit;
    font-size: 1.05rem;
    border: none;
    border-radius: 999px;
    padding: 14px 34px;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .2s ease, opacity .2s ease;
    color: #fff;
    display: inline-block;
  }
  .btn:active { transform: scale(.96); }

  .btn-yes {
    background: #e91e8c;
    box-shadow: 0 8px 20px rgba(233, 30, 140, 0.35);
  }
  .btn-yes:hover { transform: translateY(-2px); }

  .btn-no {
    background: #ce93d8;
    box-shadow: 0 8px 20px rgba(206, 147, 216, 0.35);
    position: relative;
  }
  /* smooth gliding when it runs away */
  .btn-no.fleeing {
    transition: left .45s cubic-bezier(.22,.61,.36,1),
                top  .45s cubic-bezier(.22,.61,.36,1),
                transform .25s ease,
                box-shadow .2s ease;
  }

  .btn-next {
    background: #e91e8c;
    box-shadow: 0 8px 20px rgba(233, 30, 140, 0.3);
    margin-top: 6px;
  }
  .btn-next:hover { transform: translateY(-2px); }
  .btn:disabled {
    background: #e6c6d6;
    box-shadow: none;
    cursor: not-allowed;
    opacity: .8;
  }

  .btn-row {
    display: flex;
    gap: 16px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    min-height: 60px;
  }

  /* ---- Form controls ---- */
  .field { text-align: left; margin-bottom: 20px; }
  .field label {
    display: block;
    font-size: .95rem;
    margin-bottom: 8px;
    color: #b05a86;
  }
  .field input,
  .field select {
    width: 100%;
    font-family: inherit;
    font-size: 1rem;
    padding: 12px 14px;
    border: 2px solid #f3c9de;
    border-radius: 14px;
    background: #fff;
    color: #5a3d4f;
    outline: none;
    transition: border-color .2s ease;
  }
  .field input:focus,
  .field select:focus { border-color: #e91e8c; }

  /* ---- Food grid ---- */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 8px 0 26px;
  }
  .food {
    border: 2px solid #f3c9de;
    border-radius: 16px;
    padding: 14px 6px;
    cursor: pointer;
    background: #fff;
    transition: all .18s ease;
    user-select: none;
  }
  .food:hover { border-color: #f3a9cd; }
  .food .ico { font-size: 1.9rem; display: block; margin-bottom: 4px; }
  .food .name { font-size: .82rem; color: #7d5f6f; }
  .food.selected {
    border-color: #e91e8c;
    background: #fde4f0;
    transform: scale(1.04);
  }
  .food.selected .name { color: #c2185b; }

  /* ---- Final ---- */
  .final-msg {
    font-size: 1.2rem;
    line-height: 1.5;
    color: #c2185b;
    margin-bottom: 20px;
  }
  .final-msg b { color: #e91e8c; }
  .ps {
    font-style: italic;
    font-size: .85rem;
    color: #a9889a;
    margin-bottom: 22px;
  }
  .heart-row {
    font-size: 1.4rem;
    letter-spacing: 6px;
    color: #e91e8c;
  }

  /* ---- Confetti ---- */
  #confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
  }
  .confetti-piece {
    position: absolute;
    top: -20px;
    width: 10px;
    height: 14px;
    opacity: .95;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(105vh) rotate(720deg); opacity: 1; }
  }

  @media (max-width: 420px) {
    .card { padding: 32px 22px 36px; }
    h1, h2 { font-size: 1.3rem; }
    .grid { gap: 9px; }
    .btn { padding: 13px 26px; font-size: 1rem; }
  }
</style>
</head>
<body>

<div id="hearts"></div>
<div id="confetti"></div>

<div class="card">

  <!-- SCREEN 1 -->
  <section class="screen active" id="s1">
    <img class="kitty" src="hellokitty.png" alt="Hello Kitty">
    <h1>Will you go on a date with me? 🌸</h1>
    <div class="btn-row">
      <button class="btn btn-yes" id="yesBtn">YES</button>
      <button class="btn btn-no" id="noBtn">NO</button>
    </div>
  </section>

  <!-- SCREEN 2 -->
  <section class="screen" id="s2">
    <span class="big-emoji">🧇</span>
    <h2>WAIT YOU ACTUALLY SAID YES?? 😂</h2>
    <p class="sub">I was so ready for you to say no 😅</p>
    <button class="btn btn-next" id="toS3">okay okay! →</button>
  </section>

  <!-- SCREEN 3 -->
  <section class="screen" id="s3">
    <span class="big-emoji">📅🐾</span>
    <h2>So... when are you free?</h2>
    <div class="field">
      <label for="dateInput">Pick a day 🗓️</label>
      <input type="date" id="dateInput">
    </div>
    <div class="field">
      <label for="timeInput">What time? ⏰</label>
      <select id="timeInput">
        <option value="">— choose —</option>
        <option value="12:00">12:00 Lunch</option>
        <option value="14:00">14:00 Afternoon</option>
        <option value="19:00">19:00 Dinner</option>
        <option value="21:00">21:00 Night out</option>
      </select>
    </div>
    <button class="btn btn-next" id="toS4" disabled>set the date! ♥</button>
  </section>

  <!-- SCREEN 4 -->
  <section class="screen" id="s4">
    <h2>What are we feeling? 🍽️✨</h2>
    <p class="sub">pick your vibe</p>
    <div class="grid" id="foodGrid">
      <div class="food" data-food="Pizza"><span class="ico">🍕</span><span class="name">Pizza</span></div>
      <div class="food" data-food="Sushi"><span class="ico">🍱</span><span class="name">Sushi</span></div>
      <div class="food" data-food="Burgers"><span class="ico">🍔</span><span class="name">Burgers</span></div>
      <div class="food" data-food="Pasta"><span class="ico">🍝</span><span class="name">Pasta</span></div>
      <div class="food" data-food="Tacos"><span class="ico">🌮</span><span class="name">Tacos</span></div>
      <div class="food" data-food="Ramen"><span class="ico">🍜</span><span class="name">Ramen</span></div>
    </div>
    <button class="btn btn-next" id="toS5" disabled>let's go →</button>
  </section>

  <!-- SCREEN 5 -->
  <section class="screen" id="s5">
    <span class="big-emoji">🐆💕</span>
    <p class="final-msg" id="finalMsg"></p>
    <p class="ps">P.S. normal people text. I made a website for you. no big deal.</p>
    <div class="heart-row">♥ ♥ ♥ ♥ ♥</div>
  </section>

</div>

<script>
  /* ---------- Floating hearts ---------- */
  (function makeHearts() {
    const layer = document.getElementById('hearts');
    const emojis = ['💗','💕','💖','🌸','💞','🩷'];
    const N = 45;
    for (let i = 0; i < N; i++) {
      const h = document.createElement('span');
      h.className = 'heart';
      h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      h.style.left = Math.random() * 100 + 'vw';
      h.style.fontSize = (28 + Math.random() * 42) + 'px';
      const dur = 7 + Math.random() * 8;
      h.style.animationDuration = dur + 's';
      h.style.animationDelay = (-Math.random() * dur) + 's';
      layer.appendChild(h);
    }
  })();

  /* ---------- Screen navigation ---------- */
  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const el = document.getElementById(id);
    // reflow so the animation replays
    void el.offsetWidth;
    el.classList.add('active');
  }

  /* ---------- Confetti ---------- */
  function confettiBurst() {
    const layer = document.getElementById('confetti');
    const colors = ['#e91e8c','#ce93d8','#f8bbd0','#ffd54f','#ff8fc7','#b39ddb'];
    const N = 110;
    for (let i = 0; i < N; i++) {
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      if (Math.random() > .5) p.style.borderRadius = '50%';
      const dur = 2.5 + Math.random() * 2.5;
      p.style.animationDuration = dur + 's';
      p.style.animationDelay = (Math.random() * .4) + 's';
      p.style.width = (7 + Math.random() * 7) + 'px';
      p.style.height = (10 + Math.random() * 8) + 'px';
      layer.appendChild(p);
      setTimeout(() => p.remove(), (dur + .5) * 1000);
    }
  }

  /* ---------- Audio (Web Audio API, no files) ---------- */
  let actx = null;
  let musicOn = false;
  let lastErr = 0;

  function audio() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC();
    }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }

  // a single note with a soft, romantic envelope (slow attack, long release)
  function tone(freq, start, dur, type, peak, attack) {
    const a = audio(); if (!a) return;
    const osc = a.createOscillator();
    const g = a.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    // a soft detuned partner gives a warmer, less synthetic sound
    osc.connect(g); g.connect(a.destination);
    const atk = attack != null ? attack : 0.08;
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(peak || 0.2, start + atk);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    osc.start(start);
    osc.stop(start + dur + 0.08);
  }

  // gentle looping background music — soft arpeggios + warm pad (music-box feel)
  function startMusic() {
    const a = audio(); if (!a || musicOn) return;
    musicOn = true;
    // I–V–vi–IV progression (C  G  Am  F) — the classic romantic one
    const chords = [
      [261.63, 329.63, 392.00],   // C  (C E G)
      [246.94, 311.13, 392.00],   // G/B (B D G)  -> warm voicing
      [220.00, 329.63, 440.00],   // Am (A C E -> voiced A E A)
      [174.61, 261.63, 349.23]    // F  (F C F)
    ];
    const barDur = 4.2;       // seconds per chord (very slow & dreamy)
    let bar = 0;
    function loop() {
      if (!musicOn) return;
      const t = a.currentTime + 0.06;
      const ch = chords[bar % chords.length];
      // soft sustained pad (root, low) for warmth — long swell in and out
      tone(ch[0] / 2, t, barDur, 'sine', 0.04, 0.9);
      // gentle harp-like arpeggio, notes spaced out and lingering
      const arp = [ch[0], ch[1], ch[2], ch[1] * 2];
      arp.forEach(function (f, k) {
        tone(f, t + k * (barDur / 5), barDur / 2.2, 'sine', 0.05, 0.12);
      });
      bar++;
      setTimeout(loop, barDur * 1000);
    }
    loop();
  }

  // error buzz when the NO button is approached (throttled)
  function playError() {
    const a = audio(); if (!a) return;
    const now = Date.now();
    if (now - lastErr < 350) return;
    lastErr = now;
    const t = a.currentTime;
    tone(196.00, t, 0.14, 'sawtooth', 0.12);        // low G
    tone(185.00, t + 0.13, 0.16, 'sawtooth', 0.12); // a touch lower -> "eh-ehh" error
  }

  // victory fanfare when YES is pressed
  function playVictory() {
    const a = audio(); if (!a) return;
    const t = a.currentTime;
    const notes = [523.25, 659.25, 783.99, 1046.50]; // C E G C (rising)
    notes.forEach(function (f, k) {
      tone(f, t + k * 0.12, 0.22, 'square', 0.12);
    });
    tone(1046.50, t + notes.length * 0.12, 0.5, 'triangle', 0.14); // final shiny note
  }

  // browsers block audio until a user gesture -> start music on first interaction
  function armMusic() {
    startMusic();
    window.removeEventListener('pointerdown', armMusic);
    window.removeEventListener('touchstart', armMusic);
    window.removeEventListener('keydown', armMusic);
  }
  window.addEventListener('pointerdown', armMusic);
  window.addEventListener('touchstart', armMusic);
  window.addEventListener('keydown', armMusic);

  /* ---------- Screen 1: runaway NO button ---------- */
  const noBtn = document.getElementById('noBtn');
  let noScale = 1;

  function fleeNo(pointerX, pointerY) {
    const card = document.querySelector('.card');
    const cardRect = card.getBoundingClientRect();
    // switch to absolute positioning relative to the card on first flee
    if (getComputedStyle(noBtn).position !== 'absolute') {
      const r = noBtn.getBoundingClientRect();
      noBtn.style.position = 'absolute';
      noBtn.style.left = (r.left - cardRect.left) + 'px';
      noBtn.style.top = (r.top - cardRect.top) + 'px';
      // force a reflow so the first glide animates from this start point
      void noBtn.offsetWidth;
      noBtn.classList.add('fleeing');
    }

    const maxX = cardRect.width - noBtn.offsetWidth - 12;
    const maxY = cardRect.height - noBtn.offsetHeight - 12;

    // current centre of the button (relative to card)
    const curX = parseFloat(noBtn.style.left) || 0;
    const curY = parseFloat(noBtn.style.top) || 0;
    const cx = curX + noBtn.offsetWidth / 2;
    const cy = curY + noBtn.offsetHeight / 2;

    // direction away from the pointer (fallback: random)
    let dx, dy;
    if (typeof pointerX === 'number') {
      const px = pointerX - cardRect.left;
      const py = pointerY - cardRect.top;
      dx = cx - px;
      dy = cy - py;
      const len = Math.hypot(dx, dy) || 1;
      dx /= len; dy /= len;
    } else {
      const ang = Math.random() * Math.PI * 2;
      dx = Math.cos(ang); dy = Math.sin(ang);
    }

    // glide a good distance in that direction, then clamp inside the card
    const dist = 130 + Math.random() * 90;
    let x = curX + dx * dist;
    let y = curY + dy * dist;

    // if we hit a wall, bounce the component that overflowed
    if (x < 10 || x > maxX) x = curX - dx * dist;
    if (y < 10 || y > maxY) y = curY - dy * dist;

    x = Math.min(Math.max(10, x), maxX);
    y = Math.min(Math.max(10, y), maxY);

    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';
    noScale = Math.max(0.45, noScale - 0.06);
    noBtn.style.transform = 'scale(' + noScale + ')';
    playError();
  }

  noBtn.addEventListener('mouseenter', function (e) { fleeNo(e.clientX, e.clientY); });
  noBtn.addEventListener('mousemove', function (e) { fleeNo(e.clientX, e.clientY); });
  noBtn.addEventListener('mousedown', function (e) { e.preventDefault(); fleeNo(e.clientX, e.clientY); });
  noBtn.addEventListener('touchstart', function (e) {
    e.preventDefault();
    const t = e.touches[0];
    fleeNo(t ? t.clientX : undefined, t ? t.clientY : undefined);
  }, { passive: false });
  noBtn.addEventListener('click', function (e) { e.preventDefault(); fleeNo(e.clientX, e.clientY); });

  document.getElementById('yesBtn').addEventListener('click', function () {
    startMusic();
    playVictory();
    confettiBurst();
    show('s2');
  });

  document.getElementById('toS3').addEventListener('click', () => show('s3'));

  /* ---------- Screen 3: date + time ---------- */
  const dateInput = document.getElementById('dateInput');
  const timeInput = document.getElementById('timeInput');
  const toS4 = document.getElementById('toS4');

  // minimum = today
  (function () {
    const t = new Date();
    const iso = t.getFullYear() + '-' +
      String(t.getMonth() + 1).padStart(2, '0') + '-' +
      String(t.getDate()).padStart(2, '0');
    dateInput.min = iso;
  })();

  function checkDate() {
    toS4.disabled = !(dateInput.value && timeInput.value);
  }
  dateInput.addEventListener('change', checkDate);
  dateInput.addEventListener('input', checkDate);
  timeInput.addEventListener('change', checkDate);
  toS4.addEventListener('click', function () {
    if (toS4.disabled) return;
    show('s4');
  });

  /* ---------- Screen 4: food ---------- */
  let chosenFood = null;
  const toS5 = document.getElementById('toS5');
  document.querySelectorAll('#foodGrid .food').forEach(function (cell) {
    cell.addEventListener('click', function () {
      document.querySelectorAll('#foodGrid .food').forEach(c => c.classList.remove('selected'));
      cell.classList.add('selected');
      chosenFood = cell.dataset.food;
      toS5.disabled = false;
    });
  });

  toS5.addEventListener('click', function () {
    if (toS5.disabled) return;
    buildFinal();
    show('s5');
    confettiBurst();
    sendEmail();
  });

  /* ---------- Screen 5: dynamic message ---------- */
  let prettyDate = '';
  function buildFinal() {
    const d = new Date(dateInput.value + 'T00:00:00');
    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const months = ['January','February','March','April','May','June','July',
                    'August','September','October','November','December'];
    const dayName = days[d.getDay()];
    const dayNum = d.getDate();
    const monthName = months[d.getMonth()];
    const time = timeInput.value;
    prettyDate = dayName + ' ' + dayNum + ' ' + monthName;

    const msg = 'glad you didn\'t say no. <b>' + prettyDate +
      '</b> at <b>' + time + '</b> — <b>' + chosenFood + '</b> it is 🚗💕';
    document.getElementById('finalMsg').innerHTML = msg;
  }

  /* ---------- Send the answer to my email (FormSubmit.co) ---------- */
  function sendEmail() {
    const payload = {
      _subject: '🌸 She said YES to the date!',
      Answer: 'YES 🎉',
      Day: prettyDate,
      Time: timeInput.value,
      Food: chosenFood,
      Message: 'She picked: ' + prettyDate + ' at ' + timeInput.value +
               ' — ' + chosenFood + ' 💕',
      _template: 'table'
    };
    fetch('https://formsubmit.co/ajax/lupsadaniel16@gmail.com', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(payload)
    }).catch(function () { /* silent — the page experience still works */ });
  }
</script>
</body>
</html>
